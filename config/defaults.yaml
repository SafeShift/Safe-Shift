# Default thresholds used before a driver has accumulated personal baseline history.
# All values are tuneable — adjust based on testing.
driver_profile:
  driver_id: 0
  driver_name: "Trucker Tom"

driver_baseline_defaults:
  avg_blink_rate: 15.0         # blinks/min (population average ~15)
  avg_eye_openness: 0.75       # normalized 0–1
  avg_yawn_frequency: 2.0      # yawns/hour at rest

# Fatigue signal thresholds (deviation from baseline triggers scoring)
thresholds:
  eye_openness_droopy: 0.45    # below this = droopy (fraction of baseline)
  blink_rate_low: 0.60         # below 60% of baseline = reduced blink rate (microsleep risk)
  blink_rate_high: 1.50        # above 150% = compensatory blinking
  yawn_frequency_alert: 4.0    # yawns/hour absolute threshold
  gaze_off_forward_sec: 2.0    # seconds looking away from forward = distraction
  yawn_open_sec: 1.0           # mouth must stay open this long to count as a yawn
  ear_blink_threshold: 0.20   # EAR below this = blink / closed eye
  mar_yawn_threshold: 0.55    # MAR above this = mouth open enough for yawn timer to start
  gaze_offset_threshold: 0.15 # normalised nose offset from face centre; above = off-forward

# Analysis window
analysis_window_sec: 2         # how many seconds of frames to aggregate per FrameAnalysis
recent_window_minutes: 10      # how many minutes of FrameAnalysis to include in ShiftContext

# Intervention severity escalation
severity_escalation_minutes: 5 # if same severity recurs within this window, escalate one level

vision:
  flmk_model_path: "vision/models/face_landmarker.task"
  media_source: "camera"          # "camera" | "image"
  camera_index: 0                 # webcam device index; used when media_source=camera
  image_dir: ""                   # path to image folder; used when media_source=image
  target_fps: 15

# ── Demo location (for rest_finder) ─────────────────────────────────────────
# Used when GPS is unavailable — set to your actual location day-of
demo:
  demo_lat: 36.9916
  demo_lon: -122.0583

