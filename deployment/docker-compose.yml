version: "3.9"

services:
  safeshift:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../safeshift.db:/app/safeshift.db   # persist SQLite across restarts
      - /dev/video0:/dev/video0             # pass through webcam (Linux host)
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped
